allowBuilds:
  # Compila o driver nativo do SQLite (armazenamento local).
  better-sqlite3: true
  # Scripts opcionais de otimização do firebase-admin. Negados: o pacote
  # funciona sem eles, e menos código executado na instalação é melhor.
  '@firebase/util': false
  protobufjs: false
  # Binário nativo do resolvedor de imports do ESLint, que chega por
  # `eslint-config-next`. NEGADO por dois motivos: ele é ferramenta de
  # desenvolvimento (não roda no site publicado), e o ESLint funciona sem o
  # binário — cai num resolvedor em JavaScript, mais lento e irrelevante aqui.
  #
  # Precisa estar declarado, e não apenas ausente: a partir do pnpm 10 um
  # pacote com script de instalação NÃO decidido derruba o `pnpm install` com
  # ERR_PNPM_IGNORED_BUILDS. Foi o que quebrou o primeiro deploy na Netlify —
  # localmente não aparece, porque a decisão já estava no cache da máquina.
  unrs-resolver: false

overrides:
  # Trava jose na v5, a ultima com suporte a CommonJS. A v6 (a que
  # jwks-rsa@4.1.0 puxa naturalmente) so existe como ESM puro, e o proprio
  # jwks-rsa faz `require('jose')` no CODIGO-FONTE dele (nao empacotado) —
  # `require()` sincrono de um pacote ESM-only quebra em runtime com
  # ERR_REQUIRE_ESM. Isso e um bug do jwks-rsa@4.1.0 em si (versao publicada
  # incompativel com a propria dependencia que ele declara), nao um problema
  # de bundler: testado com o bundler padrao da Netlify (zisi) e com esbuild
  # (via node_bundler), os dois quebram igual, porque o require() cru esta
  # no arquivo-fonte do pacote, antes de qualquer empacotamento acontecer.
  #
  # jwks-rsa (via firebase-admin/auth) so usa `jose` para verificar
  # assinatura JWT — funcionalidade estavel havia anos, sem mudanca de API
  # relevante entre v5 e v6 para esse uso. Travar em v5 nao perde nada aqui.
  jose: '5.10.0'
